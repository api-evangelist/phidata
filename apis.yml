aid: phidata
name: Phidata / Agno
description: >-
  Agno (formerly Phidata) is a Python framework, runtime, and control plane
  for building, running, and managing fleets of AI agents. The core agno
  library provides Agent, Team, Workflow, Tools, Memory, and Knowledge
  primitives across many LLM providers. AgentOS adds a FastAPI runtime with
  50+ REST/SSE/WebSocket endpoints, plus a hosted control plane UI at
  os.agno.com for tracing, scheduling, RBAC, audit, and human approval -
  while user data stays inside the customer's own cloud.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
url: >-
  https://raw.githubusercontent.com/api-evangelist/phidata/refs/heads/main/apis.yml
created: '2026-05-23'
modified: '2026-05-23'
specificationVersion: '0.19'
tags:
