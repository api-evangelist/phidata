apis:
  - aid: phidata:agno-framework
    name: Agno Python Framework
    description: >-
      Open-source Python framework for building agents with memory, knowledge,
      and tools. Provides Agent, Team, Workflow, Tools, Memory, Knowledge, and
      Storage primitives. Multi-modal and type-safe; supports many LLM
      providers.
    humanURL: https://docs.agno.com/introduction
    baseURL: https://pypi.org/project/agno/
    tags:
