        url: https://docs.agno.com/introduction
      - type: SDKs
        url: https://pypi.org/project/agno/
      - type: Repository
        url: https://github.com/agno-agi/agno
  - aid: phidata:agentos-runtime
    name: AgentOS Runtime API
    description: >-
      Pre-built FastAPI runtime that exposes 50+ REST, SSE, and WebSocket
      endpoints for running agents, teams, and workflows in production.
      Deployable as a Docker container in any cloud or data center, keeping
      sessions, memory, traces, and logs in the customer's infrastructure.
    humanURL: https://docs.agno.com/agent-os/introduction
    baseURL: https://docs.agno.com/agent-os/introduction
    tags:
      - REST
