        url: https://github.com/agno-agi/agno
  - aid: phidata:agentos-control-plane
    name: AgentOS Control Plane
    description: >-
      Hosted web UI at os.agno.com for managing, monitoring, debugging, and
      testing AgentOS deployments. Connects directly from the browser to the
      customer's AgentOS runtime without proxying data through Agno servers.
    humanURL: https://os.agno.com
    baseURL: https://os.agno.com
