  - Agno
  - Phidata
  - Python
  - Framework
  - Runtime
  - AgentOS
  - Multi-Agent
  - Memory
  - Tools
  - Open Source
apis:
  - aid: phidata:agno-framework
    name: Agno Python Framework
    description: >-
      Open-source Python framework for building agents with memory, knowledge,
      and tools. Provides Agent, Team, Workflow, Tools, Memory, Knowledge, and
      Storage primitives. Multi-modal and type-safe; supports many LLM
      providers.
    humanURL: https://docs.agno.com/introduction
    baseURL: https://pypi.org/project/agno/
    tags:
      - Python
      - Framework
      - Agents
      - Memory
      - Tools
      - Multi-modal
    properties:
      - type: Documentation
        url: https://docs.agno.com/introduction
      - type: SDKs
        url: https://pypi.org/project/agno/
      - type: Repository
        url: https://github.com/agno-agi/agno
  - aid: phidata:agentos-runtime
    name: AgentOS Runtime API
    description: >-
      Pre-built FastAPI runtime that exposes 50+ REST, SSE, and WebSocket
      endpoints for running agents, teams, and workflows in production.
      Deployable as a Docker container in any cloud or data center, keeping
      sessions, memory, traces, and logs in the customer's infrastructure.
    humanURL: https://docs.agno.com/agent-os/introduction
    baseURL: https://docs.agno.com/agent-os/introduction
    tags:
      - REST
      - SSE
      - WebSocket
      - FastAPI
      - Runtime
      - Self-Hosted
    properties:
      - type: Documentation
        url: https://docs.agno.com/agent-os/introduction
      - type: Repository
        url: https://github.com/agno-agi/agno
  - aid: phidata:agentos-control-plane
    name: AgentOS Control Plane
    description: >-
      Hosted web UI at os.agno.com for managing, monitoring, debugging, and
      testing AgentOS deployments. Connects directly from the browser to the
      customer's AgentOS runtime without proxying data through Agno servers.
    humanURL: https://os.agno.com
    baseURL: https://os.agno.com
    tags:
      - Control Plane
      - UI
      - Monitoring
      - Tracing
      - RBAC
    properties:
      - type: Documentation
        url: https://docs.agno.com/agent-os/introduction
      - type: Login
        url: https://os.agno.com
